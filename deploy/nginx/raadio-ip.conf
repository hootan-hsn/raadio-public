# Plain-HTTP access by the server's bare address (http://3.21.217.155), for networks
# where the domain name is blocked but the address isn't (e.g. Iran).
# Listeners only: player, streams, song title, "Coming up", saving a song.
# The studio (login, uploads) is NOT available here: passwords never go over plain HTTP.
#
# On the server this file is /etc/nginx/sites-available/raadio-ip.conf. Don't edit it
# there: change it here, push, then on the server run "raadio nginx --apply".
#
# Requests for raadio.run.place still go to its own server block (HTTPS redirect),
# because that block matches the name; this one only catches everything else on :80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log raadio_masked;   # (no full addresses: raadio-logs.conf)
    include snippets/raadio-headers.conf;   # security headers

    # Relays inside Iran (relay/README.md) pass on each listener's address; the
    # addresses of trusted relays are listed in this file (missing = no relays yet)
    include /etc/nginx/raadio-relays*.conf;

    root /var/www/radio;
    index index.html;
    include snippets/raadio-web.conf;   # compression + caching for the player's files

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/radio(-lite)?\.(mp3|opus)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Icecast refuses HEAD requests, and some players / bots check a stream with one
        # first: ask Icecast with GET, the client still only gets the headers
        proxy_method GET;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(skip|now-playing|note)$ {
        limit_req zone=raadio_write burst=100 nodelay;    # (raadio-security.conf) votes and notes; song titles never count
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
        add_header Cache-Control "no-store" always;
    }

    # Public API only: "Coming up", saving the song on air, and the chat while a host is live
    location ~ ^/api/(upcoming|track/|wave/|chat$) {
        limit_req zone=raadio_read burst=200 nodelay;     # (raadio-security.conf)
        limit_req zone=raadio_write burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        return 403;
    }
}
