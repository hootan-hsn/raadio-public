# Raadio: how the web player's own files are sent. Included inside both sites
# (raadio-domain.conf and raadio-ip.conf):
#   include snippets/raadio-web.conf;
# On the server this file is /etc/nginx/snippets/raadio-web.conf. Don't edit it there:
# change it here, push, then on the server run "raadio nginx --apply".

# Compress text files. Ubuntu's Nginx only compresses HTML by default, so the script and
# styles (~220 KB) went out uncompressed; this sends them as ~60 KB. Streams are never
# compressed (their own locations say gzip off).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json
           application/manifest+json image/svg+xml text/plain;

# The page: browsers always check for a newer one (a cheap "not modified" when unchanged)
location = /index.html {
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "no-cache" always;
}

# The site's own address, opened by a media player or a music bot (Discord bots like Muse
# use FFmpeg; others use Lavalink), gets the stream instead of the web page, so people can
# just paste https://raadio.run.place into a bot. Browsers and link previews get the page.
location = / {
    if ($http_user_agent ~* "(Lavf|libav|ffmpeg|ffprobe|Lavalink|LavaPlayer|VLC|mpv|Music Player Daemon|Winamp|foobar|Streamripper)") {
        return 302 /radio.mp3;
    }
    try_files /index.html =404;
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "no-cache" always;
}

# Script and styles: their links carry ?v=<commit> (deploy.sh), so every deploy is a new
# address and a year-long cache can never serve an old version
location ~ ^/(styles\.css|script\.js)$ {
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The service worker and manifest must be checked every time, or updates stall
location ~ ^/(sw\.js|manifest\.json)$ {
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "no-cache" always;
}

# Icons get a new file name when they change
location /icons/ {
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "public, max-age=2592000" always;
}

# Fonts and three.js, served from here rather than Google Fonts and a CDN abroad. A new
# version of a file gets a new name (fonts.css is stamped with ?v=<commit> by deploy.sh)
location ~ ^/(fonts|vendor)/ {
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "public, max-age=2592000" always;
}
