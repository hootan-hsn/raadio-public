# The Raadio site itself, the same on every domain: the player's files, the streams, voting,
# notes, the studio API and the song title. Each HTTPS server block in raadio-domain.conf
# (raadio.run.place, raadio.xyz) includes this after its own name and certificate, so the
# domains can't drift apart.
#
# On the server this file is /etc/nginx/snippets/raadio-site.conf (installed by
# `raadio nginx --apply`).

# Web player (contents of web/)
root /var/www/radio;
index index.html;
include snippets/raadio-web.conf;   # compression + caching for the player's files

location / {
    try_files $uri $uri/ =404;
}

# Icecast streams: MP3 (fallback) and Opus (default)
location ~ ^/radio(-lite)?\.(mp3|opus)$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # Icecast refuses HEAD requests, and some players / bots check a stream with one
    # first: ask Icecast with GET, the client still only gets the headers
    proxy_method GET;
    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;

    proxy_hide_header Access-Control-Allow-Origin;
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    add_header Cache-Control "no-store" always;
}

# Vote to skip, and leave a note with a caught flamingo (FastAPI)
location ~ ^/(skip|note)$ {
    limit_req zone=raadio_write burst=100 nodelay;    # (raadio-security.conf) votes and notes
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Access-Control-Allow-Origin;
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}

# Studio: login, uploads, schedule (FastAPI). Same site, so no CORS needed.
location /api/ {
    limit_req zone=raadio_read burst=200 nodelay;     # (raadio-security.conf)
    limit_req zone=raadio_write burst=100 nodelay;
    limit_req zone=raadio_login burst=10 nodelay;    # 5 a minute, studio sign-in only
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads: up to 50 MB (+ margin), streamed straight to the controller
    client_max_body_size 60m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Cache-Control "no-store" always;
}

# Song title + track id (FastAPI)
location = /now-playing {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    # who is asking: the studio's "Listening now" works out the country from this
    # (without it every listener looked like the server itself: "Unknown")
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Access-Control-Allow-Origin;
    include snippets/raadio-headers.conf;   # (a location's own add_header drops the server's)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
}
