# Access logs that can't say who listens: the address cut to its network (IPv4 /24,
# IPv6 /32), no query strings and no browser details. Many listeners are in Iran; a leaked or
# seized log mustn't identify any of them. Each Raadio server block logs with this format
# (`access_log ... raadio_masked;`), which replaces the default log there.
#
# On the server this file is /etc/nginx/conf.d/raadio-logs.conf (installed by
# `raadio nginx --apply`). With relays, $remote_addr is already the listener's address
# (set_real_ip_from), so it's masked too.

map $remote_addr $raadio_masked_addr {
    "~^(?<net4>\d+\.\d+\.\d+)\.\d+$"            $net4.0;    # IPv4: the /24
    "~^(?<net6>[0-9a-fA-F]+:[0-9a-fA-F]+):"     $net6::;    # IPv6: the first two groups (/32)
    "~^(?<head6>[0-9a-fA-F]*):"                 $head6::;   # IPv6 compressed early (fe80::1): one group
    default                                     "-";
}

log_format raadio_masked '$raadio_masked_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';
