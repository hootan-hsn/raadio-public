# Raadio: security headers for every answer. Included in each server block, and again in
# every location that sets its own headers (Nginx drops the server's add_header lines in a
# location that has any of its own):
#   include snippets/raadio-headers.conf;
# On the server this file is /etc/nginx/snippets/raadio-headers.conf. Don't edit it there:
# change it here, push, then on the server run "raadio nginx --apply".

# Files are what their type says (a script can't be slipped in as a picture)
add_header X-Content-Type-Options "nosniff" always;
# Other sites see only "raadio.xyz" when a listener follows a link, never the page's address
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No other site can put the player or the studio in a frame
add_header X-Frame-Options "SAMEORIGIN" always;
# The studio's "Go live" needs the microphone; nothing needs the rest
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
# HTTPS only, remembered for a day for now (sent over HTTPS only: raadio-security.conf).
# No includeSubDomains, no preload: easy to take back. Raise it once a week passes quietly.
add_header Strict-Transport-Security $raadio_hsts always;
# What the page may load. Report-only for now: the browser says in its console what it
# would have blocked, and blocks nothing. Enforce it once a week passes quietly.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://raadio.xyz https://raadio.run.place; connect-src 'self' https://raadio.xyz https://raadio.run.place; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
