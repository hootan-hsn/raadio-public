# Raadio: settings for all of Nginx (outside any one site).
# On the server this file is /etc/nginx/conf.d/raadio-security.conf (installed by
# `raadio nginx --apply`).

# Don't announce the Nginx version on error pages and in the Server header
server_tokens off;

# Strict-Transport-Security only over HTTPS (raadio-headers.conf). Over plain HTTP (the bare
# address, and relays pulling from it) it would mean nothing, and an empty value isn't sent.
map $scheme $raadio_hsts {
    https   "max-age=86400";
    default "";
}

# ---------- Rate limits (used by the API locations of both sites) ----------
# Generous on purpose: many listeners in Iran share one address (mobile carrier NAT, VPN
# exits), and 50 of them on one address must never see a 429. The busiest case is a live
# show with the page open: each player asks for the chat every 2 s (50 players: 25 a
# second), "Coming up" every minute, and the waveform for each new song, all at once
# (50 in one go). Song titles (/now-playing), the page and the streams are never limited.
#
# Counted per address. Requests from a trusted relay (set_real_ip_from in
# /etc/nginx/raadio-relays*.conf) aren't counted at all: there the address was rewritten,
# so $realip_remote_addr (the relay) differs from $remote_addr (its listener).
map "$realip_remote_addr $remote_addr" $raadio_client {
    "~^(\S+) \1$"   $binary_remote_addr;
    default         "";
}
# reading (GET), writing (votes, notes, chat messages, uploads), and the studio login
map $request_method $raadio_read_key {
    GET     $raadio_client;
    HEAD    $raadio_client;
    default "";
}
map $request_method $raadio_write_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $raadio_client;
}
map $uri $raadio_login_key {
    /api/login  $raadio_client;
    default     "";
}
limit_req_zone $raadio_read_key  zone=raadio_read:10m  rate=60r/s;
limit_req_zone $raadio_write_key zone=raadio_write:10m rate=10r/s;
limit_req_zone $raadio_login_key zone=raadio_login:10m rate=5r/m;
limit_req_status 429;
# A refused request is logged at "info", which the error log (level "error") leaves out:
# Nginx would write the listener's full address there.
limit_req_log_level info;
