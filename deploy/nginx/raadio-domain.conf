# https://raadio.xyz and https://raadio.run.place: the player, the streams, voting, notes and
# the studio. Both serve the same site (snippets/raadio-site.conf); each has its own certificate.
#
# On the server this file is /etc/nginx/sites-available/raadio-domain.conf. Don't edit it
# there: change it here, push, then on the server run
#   raadio nginx            (shows what would change)
#   raadio nginx --apply    (installs, tests, reloads; undoes itself if the test fails)
# This file holds no secrets (certificate keys stay in /etc/letsencrypt).

# ---------- HTTP -> HTTPS (also lets Certbot renew) ----------
server {
    listen 80;
    listen [::]:80;
    server_name raadio.run.place raadio.xyz www.raadio.xyz;
    access_log /var/log/nginx/access.log raadio_masked;   # (no full addresses: raadio-logs.conf)
    include snippets/raadio-headers.conf;   # security headers

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- raadio.run.place (the old name, kept as the player's second way in) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raadio.run.place;
    access_log /var/log/nginx/access.log raadio_masked;   # (no full addresses: raadio-logs.conf)
    include snippets/raadio-headers.conf;   # security headers

    ssl_certificate     /etc/letsencrypt/live/raadio.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raadio.run.place/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/raadio-site.conf;
}

# ---------- raadio.xyz, the station's address ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raadio.xyz www.raadio.xyz;
    access_log /var/log/nginx/access.log raadio_masked;   # (no full addresses: raadio-logs.conf)
    include snippets/raadio-headers.conf;   # security headers

    ssl_certificate     /etc/letsencrypt/live/raadio.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raadio.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/raadio-site.conf;
}
